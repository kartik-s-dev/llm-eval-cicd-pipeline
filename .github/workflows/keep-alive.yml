name: Keep backend and database awake

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend (this also reads the database)
        env:
          EVAL_GATEWAY_URL: ${{ secrets.EVAL_GATEWAY_URL }}
        run: |
          curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 20 "$EVAL_GATEWAY_URL/api/dashboard/metrics"