name: Automated LLM Evaluation CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  evaluate-llm-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Unit Tests (scoring logic)
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js tests/eval.test.js

      - name: Evaluator Quality Gate (live backend, fails the build)
        env:
          EVAL_GATEWAY_URL: ${{ secrets.EVAL_GATEWAY_URL }}
        run: node scripts/ci-eval-gate.js
